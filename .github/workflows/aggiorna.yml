name: Aggiorna Radar AI
on:
  schedule:
    - cron: "17 4 * * *"   # 06:17 in Italia (ora legale)
    - cron: "43 5 * * *"   # 07:43, riserva
  workflow_dispatch: {}    # permette anche l'avvio manuale
  push:                    # riparte quando modifichi lo script o questo file
    paths: ["generate.py", ".github/workflows/aggiorna.yml"]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python generate.py
      - run: mkdir site && cp index.html site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
